name: Build Brina APK
on: [push]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o brina-engine.zip -d temp_unzip
          PROJECT_DIR=$(find temp_unzip -name "project.godot" -exec dirname {} \; | head -n1)
          echo "Project at $PROJECT_DIR"
          cp -r "$PROJECT_DIR"/*.
          cp -r "$PROJECT_DIR"/.. 2>/dev/null || true
          ls -la
          cat project.godot || true

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.4.0
          use-dotnet: false
          include-templates: true

      - name: Import & Export
        run: |
          mkdir -p build
          godot --headless --import || true
          godot --headless --export-debug Android build/Brina.apk || godot --headless --export-release Android build/Brina.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Brina-APK
          path: build/*.apk
